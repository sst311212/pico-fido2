<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Popovers -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        <title>Pico Commissioner</title>
    </head>
    <body style="width: 500px;">
        <nav class="nav nav-tabs" role="tablist">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#nav-webusb" role="tab">WebUSB</button>
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#nav-phy" role="tab">PHY</button>
        </nav>
        <div class="tab-content mt-2">
            <div class="tab-pane fade show active" id="nav-webusb" role="tabpanel">
                <div class="container">
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="pico_platform" style="width: 100px;">Platform:</label>
                        <div class="flex-fill">
                            <input class="form-control" type="text" id="pico_platform" disabled>
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="pico_product" style="width: 100px;">Product:</label>
                        <div class="flex-fill">
                            <input class="form-control" type="text" id="pico_product" disabled>
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="pico_version" style="width: 100px;">Version:</label>
                        <div class="flex-fill">
                            <input class="form-control" type="text" id="pico_version" disabled>
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="pico_serial" style="width: 100px;">Serial:</label>
                        <div class="flex-fill">
                            <input class="form-control" type="text" id="pico_serial" disabled>
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-3">
                        <button class="btn btn-primary ms-auto me-3" style="width: 120px;" onclick="requestDevice(this)">Connect</button>
                        <button class="btn btn-danger me-auto" style="width: 120px;" onclick="forgetDevices(this)">Disconnect</button>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="nav-phy" role="tabpanel">
                <div class="container">
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="phy_usb_vendor" style="width: 150px;">Vendor:</label>
                        <div class="flex-fill">
                            <select class="form-select" id="phy_usb_vendor" data-bs-toggle="popover" data-bs-trigger="hover" data-bs-content="Yubico vendor will not able to use WebUSB">
                                <option value="" selected>Select a Vendor</option>
                                <option value="20A0:4230">NitroHSM</option>
                                <option value="20A0:42B1">NitroFIDO2</option>
                                <option value="20A0:4211">NitroStart</option>
                                <option value="20A0:4108">NitroPro</option>
                                <option value="20A0:42B2">Nitro3</option>
                                <option value="1050:0407">Yubikey5</option>
                                <option value="1050:0116">YubikeyNeo</option>
                                <option value="1050:0030">YubiHSM</option>
                                <option value="234B:0000">Gnuk</option>
                                <option value="1209:2440">GnuPG</option>
                            </select>
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="phy_usb_vidpid" style="width: 150px;">VID & PID:</label>
                        <div class="flex-fill">
                            <input class="form-control" type="text" id="phy_usb_vidpid" placeholder="1050:0407">
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="phy_usb_product" style="width: 150px;">Product Name:</label>
                        <div class="flex-fill">
                            <input class="form-control" type="text" id="phy_usb_product" maxlength="31" placeholder="Yubico Yubikey">
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="phy_btn_timeout" style="width: 150px;">Button Timeout:</label>
                        <div class="align-self-center flex-fill">
                            <input class="form-range" type="range" id="phy_btn_timeout" max="60" value="15">
                        </div>
                        <label class="col-form-label" id="phy_btn_timeout_val">15</label>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="phy_led_gpio" style="width: 150px;">LED GPIO Pin:</label>
                        <div class="flex-fill">
                            <input class="form-control" type="number" id="phy_led_gpio" max="28">
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" for="phy_led_btness" style="width: 150px;">LED Brightness:</label>
                        <div class="align-self-center flex-fill">
                            <input class="form-range" type="range" id="phy_led_btness" max="15" value="3">
                        </div>
                        <label class="col-form-label" id="phy_led_btness_val">3</label>
                    </div>
                    <div class="row row-cols-2 mt-2">
                        <label class="col-form-label text-end" style="width: 150px;">LED Options:</label>
                            <div class="row row-cols-2">
                                <div>
                                    <input class="btn-check" type="checkbox" name="phy_options" id="phy_opts_dimmable" checked>
                                    <label class="btn btn-outline-primary" for="phy_opts_dimmable">Dimmable</label>
                                </div>
                                <div>
                                    <input class="btn-check" type="checkbox" name="phy_options" id="phy_opts_steady">
                                    <label class="btn btn-outline-primary" for="phy_opts_steady">Steady</label>
                                </div>
                                <div class="text-nowrap mt-2">
                                    <input class="btn-check" type="checkbox" name="phy_options" id="phy_opts_rainbow">
                                    <label class="btn btn-outline-primary" for="phy_opts_rainbow" data-bs-toggle="popover" data-bs-trigger="hover" data-bs-content="Only available with my firmware">Rainbow (Unofficial)</label>
                                </div>
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" style="width: 150px;">Enable Curve:</label>
                        <div>
                            <input class="btn-check" type="checkbox" name="phy_options" id="phy_curve_secp256k1">
                            <label class="btn btn-outline-warning" for="phy_curve_secp256k1" data-bs-toggle="popover" data-bs-trigger="hover" data-bs-content="Not compatible with Android device">secp256k1</label>
                        </div>
                    </div>
                    <div class="row row-cols-auto mt-2">
                        <label class="col-form-label text-end" style="width: 150px;">LED Driver:</label>
                        <div class="flex-fill">
                            <select class="form-select" id="phy_led_driver">
                                <option value="" selected>Select a LED Driver</option>
                                <option value="1">Pico</option>
                                <option value="2">Pimoroni</option>
                                <option value="3">WS2812</option>
                                <option value="4">CYW43</option>
                                <option value="5">NeoPixel</option>
                                <option value="131">WS2812_Swap (Unofficial)</option>
                            </select>
                        </div>
                    </div>
                    <div class="row row-cols-2 mt-3">
                        <div>
                            <button class="btn btn-success w-100" value="apply" onclick="onCommissionClick(this)">Commission</button>
                        </div>
                        <div>
                            <button class="btn btn-danger w-100" value="reset" onclick="onCommissionClick(this)" data-bs-toggle="popover" data-bs-trigger="hover" data-bs-content="Only available with my firmware">Reset (Unofficial)</button>
                        </div>
                    </div>
                    <div class="row row-cols-2 mt-3">
                        <div>
                            <button class="btn btn-secondary w-100" value="reboot" onclick="onCommissionClick(this)">Reboot</button>
                        </div>
                        <div>
                            <button class="btn btn-warning w-100" value="bootsel" onclick="onCommissionClick(this)">Boot to BOOTSEL</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script>
        const elm_pico_platform = document.querySelector("#pico_platform");
        const elm_pico_product = document.querySelector("#pico_product");
        const elm_pico_version = document.querySelector("#pico_version");
        const elm_pico_serial = document.querySelector("#pico_serial");

        class Picokey {
            #dev = undefined;
            #epi = undefined;
            #epo = undefined;
            #bSlot = 0;
            bSeq = 0;

            Initial(device) {
                let _itf, _epi, _epo;

                device.configurations.forEach(cfg => {
                    cfg.interfaces.forEach(itf => {
                        if (itf.alternate.interfaceClass == 255) {
                            itf.alternate.endpoints.forEach(endp => {
                                _epi = endp.direction == 'in' ? endp : _epi;
                                _epo = endp.direction == 'out' ? endp : _epo;
                            });
                            _itf = itf;
                        }
                    });
                });

                if (_itf && _epi && _epo) {
                    device.open()
                    .then(_ => device.selectConfiguration(1))
                    .then(_ => device.claimInterface(_itf.interfaceNumber))
                    .then(_ => {
                        this.dev = device;
                        this.epi = _epi;
                        this.epo = _epo;
                        this.bSlot = 0;
                        this.bSeq = 0;
                        console.log(`${device.productName} Connected`);
                    });
                }
            }

            Dispose() {
                this.dev = undefined;
                this.epi = undefined;
                this.epo = undefined;
                this.bSlot = 0;
                this.bSeq = 0;
            }

            Usable() {
                if (this.dev && this.dev.opened) {
                    if (this.epi && this.epo) {
                        return true;
                    }
                }
                return false;
            }

            async Send(data) {
                if (!this.Usable()) {
                    throw new Error("Device not usable");
                }
                this.bSeq = this.bSeq == 255 ? 0 : this.bSeq + 1;
                return this.dev.transferOut(this.epo.endpointNumber, new Uint8Array(data))
                    .then(result => {
                        if (result.status == "ok") {
                            console.log(`Send: ${arrayToHexDump(data)}`);
                        } else {
                            throw new Error("Send Data Error");
                        }
                    });
            }

            async Recv() {
                if (!this.Usable()) {
                    throw new Error("Device not usable");
                }
                return this.dev.transferIn(this.epi.endpointNumber, 4096)
                    .then(result => {
                        if (result.status == "ok") {
                            var data = new Uint8Array(result.data.buffer);
                            console.log(`Recv: ${arrayToHexDump(data)}`);
                            return data;
                        } else {
                            throw new Error("Recv Data Error");
                        }
                    });
            }

            async Transfer(data) {
                return this.Send(data)
                    .then(_ => this.Recv())
                    .then(resp => {
                        var temp = new DataView(resp.buffer);
                        var dwLength = temp.getUint32(1, true);
                        temp = resp.slice(resp.length - dwLength);
                        return new Uint8Array(temp);
                    });
            }

            Apdu2XfrData(apdu) {
                var data = new Uint8Array(10 + apdu.length);
                var size = new DataView(new ArrayBuffer(4));
                size.setUint32(0, apdu.length, true);
                data.set(new Uint8Array([ 0x6F ]), 0);
                data.set(new Uint8Array(size.buffer), 1);
                data.set(new Uint8Array([ this.bSlot, this.bSeq, 0, 0, 0 ]), 5);
                data.set(new Uint8Array(apdu), 10);
                return data;
            }

            async XfrBlock(data) {
                return this.Transfer(this.Apdu2XfrData(data))
                    .then(resp => {
                        var sw1 = resp[resp.length - 2];
                        var sw2 = resp[resp.length - 1];
                        if (sw1 != 0x90 && sw2 != 0) {
                            throw new Error("APDU response invalid");
                        }
                        var data = resp.slice(0, resp.length - 2);
                        return new Uint8Array(data);
                    });
            }

            async IccPowerOn() {
                return this.Transfer([ 0x62, 0, 0, 0, 0, this.bSlot, this.bSeq, 1, 0, 0 ])
                    .then(_ => console.log("IccPowerOn Sent"));
            }

            async IccPowerOff() {
                return this.Transfer([ 0x63, 0, 0, 0, 0, this.bSlot, this.bSeq, 0, 0, 0 ])
                    .then(_ => console.log("IccPowerOff Sent"));
            }

            async EnterRescue() {
                return this.XfrBlock([ 0x00, 0xA4, 0x04, 0x04, 0x08, 0xA0, 0x58, 0x3F, 0xC1, 0x9B, 0x7E, 0x4F, 0x21, 0x00 ])
                    .then(resp => {
                        console.log("Entered Rescue Mode");
                        return resp;
                    });
            }
        }

        let pk = new Picokey();

        function arrayToHexDump(data) {
            var list = [];
            var data = new Uint8Array(data);
            data.forEach(elm => list.push(elm.toString(16).toUpperCase().padStart(2, '0')));
            return list.join(" ");
        }

        async function requestDevice(event) {
            navigator.usb.requestDevice({
                filters: [{
                    classCode: 0
                }]
            })
            .then(device => pk.Initial(device));
        }

        async function forgetDevices(event) {
            await navigator.usb.getDevices()
                .then(devices => devices.forEach(dev => {
                    dev.close()
                    .then(_ => dev.forget())
                    .then(_ => console.log(`${dev.productName} Disconnected`))
                    .then(_ => clearDeviceInfo());
                }));
            location.reload();
        }

        async function showDeviceInfo() {
            pk.IccPowerOn()
            .then(_ => pk.EnterRescue())
            .then(resp => {
                const PICO_MCU = [ "RP2040", "RP2350", "ESP32", "EMULATION" ];
                const PICO_PRODUCT = [ "Pico Key SDK", "Pico HSM", "Pico Fido", "Pico OpenPGP" ];
                elm_pico_platform.value = PICO_MCU[resp[0]];
                elm_pico_product.value = PICO_PRODUCT[resp[1]];
                elm_pico_version.value = `${resp[2]}.${resp[3]}`;
                elm_pico_serial.value = resp.slice(4).toHex().toUpperCase();
            })
            .then(_ => pk.IccPowerOff());
        }

        async function clearDeviceInfo() {
            elm_pico_platform.value = "";
            elm_pico_product.value = "";
            elm_pico_version.value = "";
            elm_pico_serial.value = "";
        }

        async function deviceMonitor(event) {
            var devices = await navigator.usb.getDevices();
            if (devices.length <= 0) {
                clearDeviceInfo();
                pk.Dispose();
                return;
            }

            if (pk.Usable()) {
                if (pk.bSeq == 0) {
                    showDeviceInfo();
                }
            } else {
                devices.forEach(dev => pk.Initial(dev));
            }
        }

        setInterval(deviceMonitor, 200);
    </script>
    <script>
        const PHY_VIDPID                    = 0x0;
        const PHY_LED_GPIO                  = 0x4;
        const PHY_LED_BTNESS                = 0x5;
        const PHY_OPTS                      = 0x6;
        const PHY_UP_BTN                    = 0x8;
        const PHY_USB_PRODUCT               = 0x9;
        const PHY_ENABLED_CURVES            = 0xA;
        const PHY_ENABLED_USB_ITF           = 0xB;
        const PHY_LED_DRIVER                = 0xC;

        const PHY_OPT_WCID                  = 0x1;
        const PHY_OPT_DIMM                  = 0x2;
        const PHY_OPT_DISABLE_POWER_RESET   = 0x4;
        const PHY_OPT_LED_STEADY            = 0x8;
        const PHY_OPT_LED_RAINBOW           = 0x10;

        const PHY_CURVE_SECP256K1           = 0x8;

        const elm_usb_vendor = document.querySelector("#phy_usb_vendor");
        const elm_usb_vidpid = document.querySelector("#phy_usb_vidpid");
        const elm_usb_product = document.querySelector("#phy_usb_product");
        const elm_btn_timeout = document.querySelector("#phy_btn_timeout");
        const elm_led_gpio = document.querySelector("#phy_led_gpio");
        const elm_led_btness = document.querySelector("#phy_led_btness");
        const elm_opts_dimmable = document.querySelector("#phy_opts_dimmable");
        const elm_opts_steady = document.querySelector("#phy_opts_steady");
        const elm_opts_rainbow = document.querySelector("#phy_opts_rainbow");
        const elm_curve_secp256k1 = document.querySelector("#phy_curve_secp256k1");
        const elm_led_driver = document.querySelector("#phy_led_driver");

        function GetPhyConfigData() {
            var p = 0;
            var phy_data = new Uint8Array(1024);

            var val_usb_vidpid = String(elm_usb_vidpid.value);
            if (val_usb_vidpid) {
                if (val_usb_vidpid.includes(':')) {
                    val_usb_vidpid = val_usb_vidpid.replace(':', '');
                }
                phy_data[p++] = PHY_VIDPID;
                phy_data[p++] = 4;
                for (i = 0; i < val_usb_vidpid.length; i += 2) {
                    phy_data[p++] = parseInt(val_usb_vidpid.substr(i, 2), 16);
                }
            }

            var val_led_gpio = parseInt(elm_led_gpio.value);
            if (val_led_gpio >= 0 && val_led_gpio <= 28) {
                phy_data[p++] = PHY_LED_GPIO;
                phy_data[p++] = 1;
                phy_data[p++] = val_led_gpio;
            }

            var val_led_btness = parseInt(elm_led_btness.value);
            if (val_led_btness >= 0 && val_led_btness <= 15) {
                phy_data[p++] = PHY_LED_BTNESS;
                phy_data[p++] = 1;
                phy_data[p++] = val_led_btness;
            }

            phy_data[p++] = PHY_OPTS;
            phy_data[p++] = 2;
            if (Boolean(elm_opts_dimmable.checked)) {
                phy_data[p + 1] |= PHY_OPT_DIMM;
            }
            if (Boolean(elm_opts_steady.checked)) {
                phy_data[p + 1] |= PHY_OPT_LED_STEADY;
            }
            if (Boolean(elm_opts_rainbow.checked)) {
                phy_data[p + 1] |= PHY_OPT_LED_RAINBOW;
            }
            p += 2;

            var val_btn_timeout = parseInt(elm_btn_timeout.value);
            if (val_btn_timeout >= 0 && val_btn_timeout <= 60) {
                phy_data[p++] = PHY_UP_BTN;
                phy_data[p++] = 1;
                phy_data[p++] = val_btn_timeout;
            }

            var val_usb_product = String(elm_usb_product.value);
            if (val_usb_product) {
                phy_data[p++] = PHY_USB_PRODUCT;
                phy_data[p++] = val_usb_product.length + 1;
                for (i = 0; i < val_usb_product.length; i++) {
                    phy_data[p++] = val_usb_product.charCodeAt(i);
                }
                phy_data[p++] = 0;
            }

            if (Boolean(elm_curve_secp256k1.checked)) {
                phy_data[p++] = PHY_ENABLED_CURVES;
                phy_data[p++] = 4;
                phy_data[p + 3] |= PHY_CURVE_SECP256K1;
                p += 4;
            }

            var val_led_driver = parseInt(elm_led_driver.value);
            if (val_led_driver) {
                phy_data[p++] = PHY_LED_DRIVER;
                phy_data[p++] = 1;
                phy_data[p++] = val_led_driver;
            }

            phy_data = phy_data.slice(0, p);
            console.log(`PHY Data: ${arrayToHexDump(phy_data)}`);

            return phy_data;
        }

        async function onCommissionClick(event) {
            if (!pk.Usable()) {
                return doCredentailCommission(event);
            }

            var apdu = undefined;
            switch (event.value) {
                case "apply":
                    data = GetPhyConfigData();
                    apdu = new Uint8Array(6 + data.length);
                    apdu.set(new Uint8Array([ 0x80, 0x1C, 1, 0 ]), 0);
                    apdu[4] = data.length;
                    apdu.set(new Uint8Array(data), 5);
                    apdu[apdu.length - 1] = 0;
                    break;
                case "reset":
                    apdu = new Uint8Array([ 0x80, 0x1C, 1, 0xFF, 0, 1, 0 ]);
                    break;
                case "reboot":
                    apdu = new Uint8Array([ 0x80, 0x1F, 0, 0, 0, 1, 0 ]);
                    break;
                case "bootsel":
                    apdu = new Uint8Array([ 0x80, 0x1F, 1, 0, 0, 1, 0 ]);
                    break;
                default:
                    return;
            }

            if (apdu) {
                pk.IccPowerOn()
                .then(_ => pk.EnterRescue())
                .then(_ => pk.XfrBlock(apdu))
                .then(_ => console.log("PHY Data Sent"))
                .then(_ => pk.IccPowerOff())
            }
        }

        async function doCredentailCommission(event) {
            const credChallenge = new Uint8Array(32);
            window.crypto.getRandomValues(credChallenge);

            const pkeyCredCreateOptions = {
                attestation: "direct",
                authenticatorSelection: {
                    authenticatorAttachment: "cross-platform"
                },
                challenge: credChallenge,
                hints: [ "security-key" ],
                pubKeyCredParams: [
                    { alg: -257, type: "public-key" },
                    { alg: -7, type: "public-key" }
                ],
                rp: { name: "阿皇仔" },
                user: {
                    id: undefined,
                    name: "+picoCommissionProfile",
                    displayName: "阿皇仔"
                }
            };

            switch (event.value) {
                case "apply":
                    pkeyCredCreateOptions.user.id = GetPhyConfigData();
                    pkeyCredCreateOptions.user.name = "+picoCommissionProfile";
                    break;
                case "reset":
                    pkeyCredCreateOptions.user.id = new Uint8Array(16);
                    pkeyCredCreateOptions.user.name = "+picoResetProfile";
                    break;
                default:
                    return;
            }
            
            return navigator.credentials.create({ publicKey: pkeyCredCreateOptions });
        }

        async function slideIndicator(event) {
            var indicator = document.querySelector(`#${event.target.id}_val`);
            if (indicator) {
                indicator.textContent = event.target.value;
            }
        }

        elm_btn_timeout.addEventListener("input", slideIndicator);
        elm_led_btness.addEventListener("input", slideIndicator);
        elm_usb_vendor.addEventListener("change", async (event) => {
            var data = event.target.value;
            elm_usb_vidpid.value = data;
            if (data) {
                elm_usb_vidpid.disabled = true;
            } else {
                elm_usb_vidpid.disabled = false;
            }
        });

        setTimeout(_ => {
            elm_btn_timeout.dispatchEvent(new Event("input"));
            elm_led_btness.dispatchEvent(new Event("input"));
            elm_usb_vendor.dispatchEvent(new Event("change"));
            document.querySelectorAll('[data-bs-toggle="popover"]').forEach(elm => new bootstrap.Popover(elm));
        }, 100);
    </script>
</html>
