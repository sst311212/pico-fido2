<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pico Commissioner</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Custom Style -->
        <link href="./style.css" rel="stylesheet">

        <link rel="icon" href="./icon-32x32.png" sizes="32x32" />
        <link rel="icon" href="./icon-192x192.png" sizes="192x192" />
    </head>
    <body>
        <div class="container" style="width: 500px;">
            <nav class="nav nav-tabs row-cols-auto mt-2" role="tablist">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#nav-usb" role="tab">WebUSB</button>
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#nav-phy" role="tab">PHY</button>
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#nav-otp" role="tab">OTP</button>
            </nav>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="nav-usb" role="tabpanel">
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w100p" for="pico_platform">Platform:</label>
                        <input class="form-control flex-grow-1" type="text" id="pico_platform" disabled>
                    </div>
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w100p" for="pico_product">Product:</label>
                        <input class="form-control flex-grow-1" type="text" id="pico_product" disabled>
                    </div>
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w100p" for="pico_version">Version:</label>
                        <input class="form-control flex-grow-1" type="text" id="pico_version" disabled>
                    </div>
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w100p" for="pico_serial">Serial:</label>
                        <input class="form-control flex-grow-1" type="text" id="pico_serial" disabled>
                    </div>
                    <div class="mx-0 mt-4 usb-show">
                        <div class="d-flex justify-content-center gap-4">
                            <button class="btn btn-primary btn-w120p" id="web_usb_connect" onclick="requestDevice(this)">Connect</button>
                            <button class="btn btn-danger btn-w120p" id="web_usb_disconn" onclick="forgetDevices(this)">Disconnect</button>
                        </div>
                    </div>
                    <div class="usb-hide">
                        <div class="d-flex justify-content-center">
                            <label class="alert alert-warning mt-4" id="web_usb_alert" role="alert">
                                WebUSB not supported on this browser
                            </label>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="nav-phy" role="tabpanel">
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w150p" for="phy_usb_vendor">Vendor:</label>
                        <select class="form-select flex-grow-1" id="phy_usb_vendor" required
                            data-bs-toggle="popover" data-bs-content="Yubico vendor will not able to use WebUSB">
                            <option value="" selected>Select a Vendor</option>
                            <option value="2E8A:10FE">Pico FIDO</option>
                            <option value="20A0:4230">NitroHSM</option>
                            <option value="20A0:42B1">NitroFIDO2</option>
                            <option value="20A0:4211">NitroStart</option>
                            <option value="20A0:4108">NitroPro</option>
                            <option value="20A0:42B2">Nitro3</option>
                            <option value="1050:0407">Yubikey5</option>
                            <option value="1050:0116">YubikeyNeo</option>
                            <option value="1050:0030">YubiHSM</option>
                            <option value="234B:0000">Gnuk</option>
                            <option value="1209:2440">GnuPG</option>
                        </select>
                    </div>
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w150p" for="phy_usb_vidpid">VID & PID:</label>
                        <input class="form-control flex-grow-1" type="text" id="phy_usb_vidpid" placeholder="1050:0407">
                    </div>
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w150p" for="phy_usb_product">Product Name:</label>
                        <input class="form-control flex-grow-1" type="text" id="phy_usb_product" maxlength="31" placeholder="Yubico Yubikey">
                    </div>
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w150p" for="phy_btn_timeout_set">Button Timeout:</label>
                        <label class="input-group-text" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="Commission Data">
                            <input class="form-check-input mt-0" type="checkbox" id="phy_btn_timeout_set">
                        </label>
                        <div class="input-group-text flex-grow-1" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="0 - Disable Button Presence">
                            <input class="form-range" type="range" id="phy_btn_timeout" min="0" max="60" value="15">
                        </div>
                        <label class="input-group-text text-3emc" id="phy_btn_timeout_val">15</label>
                    </div>
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w150p" for="phy_led_gpio">LED GPIO Pin:</label>
                        <input class="form-control gpio-pin" type="number" id="phy_led_gpio" min="0" max="28">
                    </div>
                    <div class="input-group mx-0 mt-3">
                        <label class="input-group-text text-w150p" for="phy_led_btness_set">LED Brightness:</label>
                        <label class="input-group-text" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="Commission Data">
                            <input class="form-check-input mt-0" type="checkbox" id="phy_led_btness_set">
                        </label>
                        <div class="input-group-text flex-grow-1">
                            <input class="form-range" type="range" id="phy_led_btness" min="0" max="15" value="3">
                        </div>
                        <label class="input-group-text text-3emc" id="phy_led_btness_val">3</label>
                    </div>
                    <div class="hstack gap-2 mx-0 mt-3">
                        <div class="input-group align-self-start w-auto">
                            <label class="input-group-text text-w150p" for="phy_led_options_set">LED Options:</label>
                            <div class="input-group-text" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="Commission Data">
                                <input class="form-check-input mt-0" type="checkbox" id="phy_led_options_set">
                            </div>
                        </div>
                        <div class="btn-group-vertical">
                            <div class="btn-group">
                                <input class="btn-check" type="checkbox" name="phy_options" id="phy_opts_dimm" checked>
                                <label class="btn btn-outline-primary btn-w108p" for="phy_opts_dimm">Dimmable</label>
                                <input class="btn-check" type="checkbox" name="phy_options" id="phy_opts_steady">
                                <label class="btn btn-outline-primary btn-w108p" for="phy_opts_steady">Steady</label>
                            </div>
                            <div class="btn-group">
                                <input class="btn-check" type="checkbox" name="phy_options" id="phy_opts_rainbow">
                                <label class="btn btn-outline-primary btn-w108p" for="phy_opts_rainbow" data-bs-toggle="popover"
                                    data-bs-placement="bottom" data-bs-content="Only available with my firmware">Rainbow</label>
                            </div>
                        </div>
                    </div>
                    <div class="hstack gap-2 mx-0 mt-3">
                        <div class="input-group align-self-start w-auto">
                            <label class="input-group-text text-w150p" for="phy_curve_options_set">Enable Curve:</label>
                            <div class="input-group-text" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="Commission Data">
                                <input class="form-check-input mt-0" type="checkbox" id="phy_curve_options_set">
                            </div>
                        </div>
                        <input class="btn-check" type="checkbox" name="phy_options" id="phy_curve_secp256k1">
                        <label class="btn btn-outline-warning btn-w108p" for="phy_curve_secp256k1" data-bs-toggle="popover"
                            data-bs-placement="top" data-bs-content="Not compatible with Android device">secp256k1</label>
                    </div>
                    <div class="input-group row mx-0 mt-3">
                        <label class="input-group-text text-w150p">LED Driver:</label>
                        <select class="form-select flex-w-auto" id="phy_led_driver">
                            <option value="" selected>Select a LED Driver</option>
                            <option value="1">Pico</option>
                            <option value="2">Pimoroni</option>
                            <option value="3">WS2812</option>
                            <option value="4">CYW43</option>
                            <option value="5">NeoPixel</option>
                            <option value="131">WS2812_Swap (Unofficial)</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-center row mx-0 mt-4 gap-5">
                        <button class="btn btn-success btn-w180p" value="apply" onclick="onCommissionClick(this)">Commission</button>
                        <button class="btn btn-danger btn-w180p" value="reset" onclick="onCommissionClick(this)" data-bs-toggle="popover"
                            data-bs-placement="top" data-bs-content="Only available with my firmware">Reset Settings</button>
                    </div>
                    <div class="d-flex justify-content-center row mx-0 mt-3 gap-5 phy-show">
                        <button class="btn btn-secondary btn-w180p" value="reboot" onclick="onCommissionClick(this)">Normal Reboot</button>
                        <button class="btn btn-warning btn-w180p" value="bootsel" onclick="onCommissionClick(this)">Boot to BOOTSEL</button>
                    </div>
                    <div class="d-flex justify-content-center mt-4 phy-hide">
                        <label class="alert alert-warning" id="web_phy_alert" role="alert">
                            Make Credentials Fallback Mode
                        </label>
                    </div>
                </div>
                <div class="tab-pane fade" id="nav-otp" role="tabpanel">
                    <div class="btn-group mt-3 w-100">
                        <div class="input-group">
                            <label class="input-group-text">Slot 1</label>
                            <input class="form-control otp-slots" type="text" id="otp_slot_1" disabled>
                        </div>
                        <div class="btn-group dropstart otp-act-1">
                            <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Swap</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item text-center" data-swap="1,2" onclick="onOtpSwapClick(this)">Slot 2</button></li>
                                <li><button class="dropdown-item text-center" data-swap="1,3" onclick="onOtpSwapClick(this)">Slot 3</button></li>
                                <li><button class="dropdown-item text-center" data-swap="1,4" onclick="onOtpSwapClick(this)">Slot 4</button></li>
                            </ul>
                        </div>
                        <button class="btn btn-danger otp-act-1" data-slot="1" onclick="onOtpDeleteClick(this)">Delete</button>
                    </div>
                    <div class="btn-group mt-3 w-100">
                        <div class="input-group">
                            <label class="input-group-text">Slot 2</label>
                            <input class="form-control otp-slots" type="text" id="otp_slot_2" disabled>
                        </div>
                        <div class="btn-group dropstart otp-act-2">
                            <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Swap</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" data-swap="2,1" onclick="onOtpSwapClick(this)">Slot 1</button></li>
                                <li><button class="dropdown-item" data-swap="2,3" onclick="onOtpSwapClick(this)">Slot 3</button></li>
                                <li><button class="dropdown-item" data-swap="2,4" onclick="onOtpSwapClick(this)">Slot 4</button></li>
                            </ul>
                        </div>
                        <button class="btn btn-danger otp-act-2" data-slot="2" onclick="onOtpDeleteClick(this)">Delete</button>
                    </div>
                    <div class="btn-group mt-3 w-100">
                        <div class="input-group">
                            <label class="input-group-text">Slot 3</label>
                            <input class="form-control otp-slots" type="text" id="otp_slot_3" disabled>
                        </div>
                        <div class="btn-group dropstart otp-act-3">
                            <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Swap</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" data-swap="3,1" onclick="onOtpSwapClick(this)">Slot 1</button></li>
                                <li><button class="dropdown-item" data-swap="3,2" onclick="onOtpSwapClick(this)">Slot 2</button></li>
                                <li><button class="dropdown-item" data-swap="3,4" onclick="onOtpSwapClick(this)">Slot 4</button></li>
                            </ul>
                        </div>
                        <button class="btn btn-danger otp-act-3" data-slot="3" onclick="onOtpDeleteClick(this)">Delete</button>
                    </div>
                    <div class="btn-group mt-3 w-100">
                        <div class="input-group">
                            <label class="input-group-text">Slot 4</label>
                            <input class="form-control otp-slots" type="text" id="otp_slot_4" disabled>
                        </div>
                        <div class="btn-group dropstart otp-act-4">
                            <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Swap</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" data-swap="4,1" onclick="onOtpSwapClick(this)">Slot 1</button></li>
                                <li><button class="dropdown-item" data-swap="4,2" onclick="onOtpSwapClick(this)">Slot 2</button></li>
                                <li><button class="dropdown-item" data-swap="4,3" onclick="onOtpSwapClick(this)">Slot 3</button></li>
                            </ul>
                        </div>
                        <button class="btn btn-danger otp-act-4" data-slot="4" onclick="onOtpDeleteClick(this)">Delete</button>
                    </div>
                    <div class="mt-4 phy-show">
                        <div class="d-flex justify-content-center">
                            <button class="btn btn-primary btn-w180p" onclick="onOtpReadExtClick(this)">Read OTP Data</button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center mt-4 phy-hide">
                        <label class="alert alert-warning text-center w-100" id="web_otp_alert" role="alert">
                            Need WebUSB for Yubico OTP configuration
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div class="position-fixed bottom-0 end-0 p-3">
            <div class="toast bg-success-subtle" id="web_phy_toast" role="status" aria-live="polite" aria-atomic="true">
                <div class="d-flex">
                    <label class="toast-body">Commission Succeeded</label>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <input type="text" id="web_usb_status" disabled hidden>
        <input type="text" id="web_phy_status" disabled hidden>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="./picokey.js"></script>
    <script type="text/javascript" src="./picokey_phy.js"></script>
    <script type="text/javascript" src="./picokey_otp.js"></script>
    <script type="text/javascript" src="./main.js"></script>
</html>
